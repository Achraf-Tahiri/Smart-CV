<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" fill="none">
  <title>Smart CV — from documents to candidate insights</title>
  <desc>A recruitment workspace built with FastAPI, Next.js, and PostgreSQL.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse"><stop stop-color="#111B3D"/><stop offset="1" stop-color="#312E81"/></linearGradient>
    <linearGradient id="card" x1="880" y1="60" x2="1150" y2="300" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#E0E7FF"/></linearGradient>
  </defs>
  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <circle cx="1150" cy="350" r="240" stroke="#818CF8" stroke-opacity=".17"/>
  <circle cx="1150" cy="350" r="185" stroke="#818CF8" stroke-opacity=".17"/>
  <circle cx="1150" cy="350" r="130" stroke="#818CF8" stroke-opacity=".17"/>
  <text x="60" y="68" fill="#A5B4FC" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="3">RECRUITMENT WORKSPACE</text>
  <text x="57" y="149" fill="white" font-family="Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="-2">Smart CV<tspan fill="#22D3EE">.</tspan></text>
  <text x="60" y="200" fill="#E0E7FF" font-family="Arial, sans-serif" font-size="25">From documents to candidate insights.</text>
  <text x="60" y="236" fill="#A5B4FC" font-family="Arial, sans-serif" font-size="16">Structured profiles. Background processing. Hybrid search.</text>
  <g font-family="Arial, sans-serif" font-size="13" font-weight="600">
    <rect x="60" y="280" width="100" height="30" rx="15" fill="#FFFFFF" fill-opacity=".08"/><text x="85" y="300" fill="#E0E7FF">FastAPI</text>
    <rect x="170" y="280" width="100" height="30" rx="15" fill="#FFFFFF" fill-opacity=".08"/><text x="195" y="300" fill="#E0E7FF">Next.js</text>
    <rect x="280" y="280" width="170" height="30" rx="15" fill="#FFFFFF" fill-opacity=".08"/><text x="299" y="300" fill="#E0E7FF">PostgreSQL + pgvector</text>
  </g>
  <rect x="905" y="54" width="230" height="250" rx="22" transform="rotate(8 905 54)" fill="#818CF8" fill-opacity=".18"/>
  <rect x="870" y="55" width="230" height="250" rx="22" fill="url(#card)"/>
  <rect x="894" y="79" width="55" height="55" rx="16" fill="#4F46E5"/>
  <path d="M909 91h16l8 8v24h-24V91Z" stroke="white" stroke-width="2.5" stroke-linejoin="round"/><path d="M915 105h9m-9 7h12" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="963" y="88" width="110" height="9" rx="4.5" fill="#312E81"/>
  <rect x="963" y="106" width="76" height="7" rx="3.5" fill="#A5B4FC"/>
  <path d="M894 158h182" stroke="#C7D2FE"/>
  <rect x="894" y="179" width="130" height="8" rx="4" fill="#818CF8"/><rect x="894" y="197" width="180" height="7" rx="3.5" fill="#C7D2FE"/><rect x="894" y="215" width="156" height="7" rx="3.5" fill="#C7D2FE"/>
  <rect x="894" y="251" width="66" height="25" rx="12.5" fill="#E0E7FF"/><rect x="969" y="251" width="66" height="25" rx="12.5" fill="#E0E7FF"/>
  <circle cx="1100" cy="266" r="39" fill="#22D3EE"/><path d="m1083 266 11 11 23-24" stroke="#172554" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
