name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API — lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    # Base Postgres (avec pgvector) pour les tests d'intégration.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nscv
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: nscv
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nscv -d nscv"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Les tests dérivent la base de test (nscv_test) de cette URL.
      DATABASE_URL: postgresql+asyncpg://nscv:change-me@localhost:5432/nscv
    steps:
      - uses: actions/checkout@v4
      - name: Installer uv (+ Python géré par uv)
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.2"        # version figée (cohérente avec le Dockerfile)
          enable-cache: true
      - name: Installer les dépendances (versions figées du lockfile)
        run: uv sync --frozen
      - name: Lint (ruff)
        run: uv run ruff check src tests
      - name: Format (black --check)
        run: uv run black --check src tests
      - name: Tests (pytest)
        run: uv run pytest

  web:
    name: Web — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Installer les dépendances
        run: pnpm install --no-frozen-lockfile
      - name: Build
        run: pnpm build
