[project]
name = "new-smart-cv-api"
version = "0.1.0"
description = "API New Smart CV — backend FastAPI (async)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "structlog>=24.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pgvector>=0.3",
    # --- Auth (Phase 1.2) ---
    "argon2-cffi>=23.1",          # hachage de mot de passe (Argon2id)
    "pyjwt>=2.9",                 # émission / vérification des JWT
    "python-multipart>=0.0.12",   # formulaires (OAuth2 password flow)
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "anyio>=4",
    "httpx>=0.27",
    "ruff>=0.7",
    "black>=24.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Le package Python `app` vit dans src/ (layout « src »).
[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F = erreurs & pyflakes, I = tri des imports, UP = modernisation, B = pièges courants
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
